services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bodhi
      POSTGRES_PASSWORD: ${BODHI_DB_PASSWORD:-bodhi}
      POSTGRES_DB: bodhi
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bodhi"]
      interval: 5s
      timeout: 5s
      retries: 5

  bodhi-server:
    build: .
    ports:
      - "8080:8080"
    environment:
      BODHI_DB_URL: "postgres://bodhi:${BODHI_DB_PASSWORD:-bodhi}@postgres:5432/bodhi?sslmode=disable"
      BODHI_JWT_SECRET: "${BODHI_JWT_SECRET}"
      BODHI_ENCRYPTION_KEY: "${BODHI_ENCRYPTION_KEY}"
      BODHI_PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
